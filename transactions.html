<!DOCTYPE html>
<html lang="bn">

<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriTech - লেনদেন</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/transactions.css">

    <!-- Web Components & Modules -->
    <script type="module" src="js/components.js" defer></script>
    <script type="module" src="js/transactions.js" defer></script>
</head>

<body class="transactions-body">

    <!-- Fixed Header specific to inner scroll view -->
    <app-page-header page-title="সকল লেনদেন"></app-page-header>

    <!-- Content Area -->
    <main class="transactions-content">

        <!-- UX: Navigation to Ledger / Hishab Page -->
        <div style="padding: 16px; padding-bottom: 4px;">
            <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;"
                onclick="window.location.href='hishab.html'">
                <div>
                    <h4 style="font-size: 15px; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px;">
                        বিস্তারিত হিসাব খাতা</h4>
                    <p style="font-size: 12px; color: var(--text-muted);">মাসিক রিপোর্ট ও অন্যান্য খাতা</p>
                </div>
                <div
                    style="background: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); color: var(--primary);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>

        <div class="transaction-tabs">
            <button class="tab-btn active" data-tab="all">সকল</button>
            <button class="tab-btn" data-tab="income">আয়</button>
            <button class="tab-btn" data-tab="expense">ব্যয়</button>
        </div>

        <section class="transactions-container" id="transactionsList" style="margin-top: 20px;">
            <!-- Skeleton Loading -->
            <div id="tr-skeleton" style="display: none;">
                <div class="transaction-item" style="opacity: 0.7;">
                    <div class="tr-icon" style="background: #E2E8F0; width: 40px; height: 40px; border-radius: 12px;"></div>
                    <div class="tr-info" style="flex: 1;">
                        <div style="height: 16px; background: #E2E8F0; border-radius: 4px; width: 60%; margin-bottom: 8px;"></div>
                        <div style="height: 12px; background: #E2E8F0; border-radius: 4px; width: 40%;"></div>
                    </div>
                    <div style="height: 16px; background: #E2E8F0; border-radius: 4px; width: 20%;"></div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="tr-empty-state" class="empty-state"
                style="display: none; text-align: center; padding: 60px 20px; color: #94A3B8;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px; opacity: 0.5;">
                    <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                <p style="font-size: 14px; font-weight: 500;">কোনো লেনদেন নেই</p>
            </div>
        </section>

        <!-- Floating Action Button -->
        <button class="fab-btn" aria-label="Add Transaction">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </main>

    <!-- Add Transaction Bottom Sheet Modal -->
    <div class="calendar-modal" id="addTransactionModal">
        <div class="calendar-content">
            <div class="calendar-header">
                <h4 id="transactionModalTitle">নতুন হিসাব যোগ করুন</h4>
                <button class="close-modal" id="closeAddModal" aria-label="Close modal">&times;</button>
            </div>
            <div class="calendar-body">
                <div class="input-group" style="margin-bottom: 16px;">
                    <label
                        style="display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">লেনদেনের
                        ধরন</label>
                    <div style="display: flex; gap: 12px;">
                        <label
                            style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer;">
                            <input type="radio" name="tr_type" value="income" checked
                                style="accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer;"> আয়
                        </label>
                        <label
                            style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer;">
                            <input type="radio" name="tr_type" value="expense"
                                style="accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer;"> ব্যয়
                        </label>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 16px;">
                    <label
                        style="display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">ক্যাটাগরি</label>
                    <div style="position: relative;">
                        <select id="tr-category"
                            style="width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; appearance: none; background: white; color: var(--text-main); font-family: inherit;">
                            <option value="বীজ/চারা">বীজ/চারা</option>
                            <option value="সার">সার</option>
                            <option value="কীটনাশক">কীটনাশক</option>
                            <option value="সেচ">সেচ</option>
                            <option value="দিনমজুর/শ্রমিক">দিনমজুর/শ্রমিক</option>
                            <option value="পরিবহন">পরিবহন</option>
                            <option value="ফসল বিক্রয়">ফসল বিক্রয়</option>
                            <option value="ভর্তুকি">ভর্তুকি</option>
                            <option value="অন্যান্য">অন্যান্য</option>
                        </select>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="position: absolute; right: 14px; top: 16px; pointer-events: none;">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 16px;">
                    <label
                        style="display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">পরিমাণ
                        (৳)</label>
                    <input type="number" id="tr-amount" placeholder="0"
                        style="width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 16px; outline: none;">
                </div>

                <div class="input-group" style="margin-bottom: 16px;">
                    <label
                        style="display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">তারিখ</label>
                    <div style="position: relative;">
                        <input type="text" id="tr-date" readonly placeholder="তারিখ নির্বাচন করুন"
                            style="width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; color: var(--text-main); font-family: inherit; background: white; cursor: pointer;">
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 16px;">
                    <label
                        style="display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">লিংকড
                        ফসল (বাধ্যতামূলক)</label>
                    <div style="position: relative;">
                        <select id="tr-crop" required
                            style="width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; appearance: none; background: white; color: var(--text-main); font-family: inherit;">
                            <option value="">কোনো ফসল সিলেক্ট করুন</option>
                        </select>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="position: absolute; right: 14px; top: 16px; pointer-events: none;">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 24px;">
                    <label
                        style="display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px;">বিবরণ/নোট</label>
                    <input type="text" id="tr-desc" placeholder="যেমন: ইউরিয়া ২ বস্তা"
                        style="width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 16px; outline: none;">
                </div>
            </div>
            <div class="calendar-footer" style="display: flex; gap: 12px;">
                <button class="btn-primary w-100" id="saveTransaction">যোগ করুন</button>
                <button class="btn-primary" id="deleteTransactionBtn" style="background-color: var(--danger); border-color: var(--danger); display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Date Selection Custom Calendar Bottom Sheet -->
    <div class="calendar-modal" id="dateSelectionModal" style="z-index: 1055;" onclick="if(event.target === this) { this.classList.remove('active'); document.body.style.overflow=''; }">
        <div class="calendar-content" style="padding-bottom: 24px;">
            <div class="calendar-header">
                <h3>তারিখ নির্বাচন করুন</h3>
                <button class="close-modal" onclick="document.getElementById('dateSelectionModal').classList.remove('active'); document.body.style.overflow='';">&times;</button>
            </div>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5;">লেনদেনের জন্য একটি তারিখ নির্ধারণ করুন।</p>

            <div class="calendar-body" style="margin-bottom: 24px; padding: 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div class="calendar-month" id="dsMonth"
                        style="text-align: left; font-size: 16px; font-family: 'Noto Sans Bengali', sans-serif; font-weight: 700;">
                        --</div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="changeTransactionMonth(-1)"
                            style="border: 1px solid var(--border-color); background: #F8FAFC; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: background 0.2s;"
                            onmouseover="this.style.background='#EEF2FF'" onmouseout="this.style.background='#F8FAFC'">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <button onclick="changeTransactionMonth(1)"
                            style="border: 1px solid var(--border-color); background: #F8FAFC; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: background 0.2s;"
                            onmouseover="this.style.background='#EEF2FF'" onmouseout="this.style.background='#F8FAFC'">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="calendar-weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; font-weight: 700; color: #64748B; margin-bottom: 8px;">
                    <span>রবি</span><span>সোম</span><span>মঙ্গল</span><span>বুধ</span><span>বৃহ</span><span>শুক্র</span><span>শনি</span>
                </div>
                <div class="calendar-days" id="dsDays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;">
                    <!-- JS injects days -->
                </div>
            </div>

            <button class="btn-primary w-100" id="confirmDateSelection" style="box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px;">তারিখ নির্ধারণ করুন</button>
        </div>
    </div>

    <!-- Global Layout Components -->
    <app-bottom-nav></app-bottom-nav>

</body>

</html>
