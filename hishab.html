<!DOCTYPE html>
<html lang="bn">

<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriTech - বিস্তারিত হিসাব খাতা</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/hishab.css">

    <!-- Web Components & Modules -->
    <script type="module" src="js/components.js" defer></script>
    <script type="module" src="js/hishab.js" defer></script>
</head>

<body class="hishab-body">

    <!-- Fixed Header -->
    <app-page-header page-title="বিস্তারিত হিসাব খাতা">
        <button slot="action" class="header-action" onclick="alert('ফিল্টার অপশন খুব শীঘ্রই আসছে!')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
        </button>
    </app-page-header>

    <!-- Top Summary -->
    <section class="hishab-summary-section">
        <!-- Net Balance -->
        <div class="net-balance-card" id="netBalanceCard">
            <div class="net-label">বর্তমান ব্যালেন্স</div>
            <div class="net-amount" id="netBalanceAmount">৳ ০</div>
        </div>

        <div class="summary-stats-grid">
            <div class="stat-box income">
                <div class="stat-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                    মোট আয়
                </div>
                <div class="stat-val" id="totalIncomeAmount">৳ ০</div>
            </div>
            <div class="stat-box expense">
                <div class="stat-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
                        <polyline points="17 18 23 18 23 12"></polyline>
                    </svg>
                    মোট ব্যয়
                </div>
                <div class="stat-val" id="totalExpenseAmount">৳ ০</div>
            </div>
        </div>
    </section>

    <!-- Filters Row -->
    <div class="filter-row">
        <select class="filter-select" id="monthFilter">
            <option value="all">সব সময়</option>
            <option value="this_month">চলতি মাস</option>
            <option value="last_month">গত মাস</option>
            <option value="this_year">চলতি বছর</option>
        </select>
        <select class="filter-select" id="farmFilter">
            <option value="all">সকল জমি</option>
        </select>
        <select class="filter-select" id="cropFilter">
            <option value="all">সকল ফসল</option>
        </select>
    </div>

    <!-- Ledger Content -->
    <section class="ledger-container" id="ledgerContainer">
        <!-- Skeleton Loading -->
        <div id="ledger-skeleton" style="display: none; padding: 20px;">
            <div style="height: 20px; background: #E2E8F0; border-radius: 4px; width: 40%; margin-bottom: 16px;"></div>
            <div style="display: flex; gap: 12px; margin-bottom: 20px; opacity: 0.7;">
                <div style="background: #E2E8F0; width: 40px; height: 40px; border-radius: 12px;"></div>
                <div style="flex: 1;">
                    <div style="height: 16px; background: #E2E8F0; border-radius: 4px; width: 60%; margin-bottom: 8px;"></div>
                    <div style="height: 12px; background: #E2E8F0; border-radius: 4px; width: 40%;"></div>
                </div>
                <div style="height: 16px; background: #E2E8F0; border-radius: 4px; width: 20%;"></div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="ledger-empty-state" class="empty-state" style="display: none; text-align: center; padding: 60px 20px; color: #94A3B8;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px; opacity: 0.5;">
                <path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <path d="M2 15h10"></path>
                <path d="M5 12l-3 3 3 3"></path>
            </svg>
            <p style="font-size: 14px; font-weight: 500;">কোনো হিসাব পাওয়া যায়নি</p>
        </div>
    </section>

    <!-- Export Report FAB -->
    <button class="fab-report" onclick="alert('রিপোর্ট ডাউনলোড খুব শীঘ্রই আসছে...')" aria-label="Download Report">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
    </button>

    <!-- Global Layout Components -->
    <app-bottom-nav></app-bottom-nav>

</body>

</html>
