<!DOCTYPE html>
<html lang="bn">

<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriTech - Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Web Components & Modules -->
    <script type="module" src="js/components.js" defer></script>
    <script type="module" src="js/dashboard.js" defer></script>
    <script src="js/timeline.js" defer></script>
</head>

<body class="dashboard-body">

    <!-- Global Layout Components -->
    <app-dash-header></app-dash-header>
    <app-sidebar></app-sidebar>
    <app-bottom-nav></app-bottom-nav>

    <!-- Calendar Bottom Sheet Modal -->
    <div class="calendar-modal" id="calendarModal">
        <div class="calendar-content">
            <div class="calendar-header">
                <h4>নতুন তারিখ নির্বাচন করুন</h4>
                <button class="close-modal" aria-label="Close modal">&times;</button>
            </div>
            <div class="calendar-body">
                <div class="calendar-month">মার্চ ২০২৬</div>
                <div class="calendar-weekdays">
                    <span>রবি</span><span>সোম</span><span>মঙ্গল</span><span>বুধ</span><span>বৃহ</span><span>শুক্র</span><span>শনি</span>
                </div>
                <div class="calendar-days" id="calendarDays">
                    <!-- JS will populate -->
                </div>
            </div>
            <div class="calendar-footer">
                <button class="btn-primary w-100" id="confirmReschedule">নির্ধারণ করুন</button>
            </div>
        </div>
    </div>

    <main class="dashboard-container">
        <!-- Dashboard Sleek Hero -->
        <div class="dashboard-hero-section" id="dashHeroSection">
            <div class="dhero-bg-shapes">
                <div class="dhero-shape-1"></div>
                <div class="dhero-shape-2"></div>
            </div>
            
            <div class="dhero-content" id="dashHeroContent">
                <div class="dhero-text">
                    <p class="dhero-greeting" id="dashGreetingHero">শুভ সকাল! 👋</p>
                    <h2 class="dhero-title skeleton skeleton-text" id="dashHeroTitle" style="width: 150px; display: inline-block;"></h2>
                    <p class="dhero-subtitle skeleton skeleton-text" id="dashHeroSubtitle" style="width: 200px; display: inline-block; margin-top: 8px;"></p>
                    <div id="dashHeroActions" style="margin-top: 12px; display: none; gap: 8px; align-items: center; flex-wrap: wrap;"></div>
                </div>
                
                <a href="weather_details.html" class="dhero-widget-glass" style="text-decoration:none;">
                    <div class="dhero-weather-icon skeleton skeleton-circle" id="dashWeatherIcon" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 16px;"></div>
                    <div class="dhero-weather-info" style="display: flex; flex-direction: column; gap: 4px;">
                        <span class="dhero-temp skeleton skeleton-text" id="dashWeatherTemp" style="width: 30px; height: 14px; border-radius: 4px;"></span>
                        <span class="dhero-cond skeleton skeleton-text" id="dashWeatherCond" style="width: 50px; height: 12px; border-radius: 4px;"></span>
                    </div>
                </a>
            </div>
        </div>

        <h3 class="section-title">কুইক অ্যাকশন</h3>

        <!-- Quick Action Grid -->
        <section class="quick-grid">
            <a href="khamar.html" class="q-card">
                <div class="q-icon crops">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 20A7 7 0 0 1 4 13V4h9a7 7 0 0 1 7 7v9h-9Z"></path>
                        <path d="M4 20L11 13"></path>
                    </svg>
                </div>
                <span>আমার খামার</span>
                <small id="dashFarmCount" class="skeleton skeleton-text" style="width: 50px; display: inline-block; margin-top: 4px;"></small>
            </a>
            <a href="transactions.html" class="q-card">
                <div class="q-icon ledger">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                </div>
                <span>আয়-ব্যয়</span>
                <small id="dashIncomeExpense" class="skeleton skeleton-text" style="width: 70px; display: inline-block; margin-top: 4px;"></small>
            </a>
            <a href="crop_doctor.html" class="q-card">
                <div class="q-icon subsidy">
                    <!-- Modified to Crop Doctor / AI Scanner -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z">
                        </path>
                        <circle cx="12" cy="13" r="3"></circle>
                    </svg>
                </div>
                <span>কৃষি স্ক্যানার</span>
                <small>রোগ নির্ণয়</small>
            </a>
            <a href="#" class="q-card">
                <div class="q-icon support">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                        <path
                            d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z">
                        </path>
                    </svg>
                </div>
                <span>বিশেষজ্ঞ সাপোর্ট</span>
                <small>ভিডিও কল</small>
            </a>
        </section>

        <div class="section-header">
            <h3 class="section-title">কাজের টাইমলাইন</h3>
            <a href="tasks.html" class="view-all">সব দেখুন</a>
        </div>
        <!-- Vertical Task Timeline -->
        <section class="timeline-container" id="dashTimelineContainer">
            <!-- Skeleton items -->
            <div class="timeline-item pending" id="tl-skeleton-1">
                <div class="tl-node"><div class="skeleton skeleton-circle" style="width: 16px; height: 16px;"></div></div>
                <div class="tl-content">
                    <p class="tl-time skeleton skeleton-text" style="width: 120px;"></p>
                    <p class="tl-title skeleton skeleton-text" style="width: 180px; height: 18px;"></p>
                </div>
            </div>
            <div class="timeline-item pending" id="tl-skeleton-2">
                <div class="tl-node"><div class="skeleton skeleton-circle" style="width: 16px; height: 16px;"></div></div>
                <div class="tl-content">
                    <p class="tl-time skeleton skeleton-text" style="width: 100px;"></p>
                    <p class="tl-title skeleton skeleton-text" style="width: 150px; height: 18px;"></p>
                </div>
            </div>
        </section>

        <div class="section-header">
            <h3 class="section-title">সাম্প্রতিক লেনদেন</h3>
            <a href="transactions.html" class="view-all">সব দেখুন</a>
        </div>
        <!-- Recent Transactions -->
        <section class="transactions-container" id="dashTransactionsContainer">
            <div class="transaction-item" id="tr-skeleton-1">
                <div class="tr-icon skeleton skeleton-circle" style="width: 40px; height: 40px; border-radius: 50%; border: none;"></div>
                <div class="tr-info" style="flex: 1;">
                    <h4 class="skeleton skeleton-text" style="width: 120px; margin-bottom: 4px;"></h4>
                    <p class="skeleton skeleton-text" style="width: 80px;"></p>
                </div>
                <div class="tr-amount skeleton skeleton-text" style="width: 60px;"></div>
            </div>
            <div class="transaction-item" id="tr-skeleton-2">
                <div class="tr-icon skeleton skeleton-circle" style="width: 40px; height: 40px; border-radius: 50%; border: none;"></div>
                <div class="tr-info" style="flex: 1;">
                    <h4 class="skeleton skeleton-text" style="width: 100px; margin-bottom: 4px;"></h4>
                    <p class="skeleton skeleton-text" style="width: 90px;"></p>
                </div>
                <div class="tr-amount skeleton skeleton-text" style="width: 60px;"></div>
            </div>
        </section>

        <!-- Bottom padding to avoid nav overlap -->
        <div class="scroll-spacer"></div>
    </main>

</body>

</html>
