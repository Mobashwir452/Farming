<!DOCTYPE html>
<html lang="bn">

<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>আবহাওয়া ও পূর্বাভাস | AgriTech</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/weather_details.css">

    <!-- Web Components & Scripts -->
    <script type="module" src="js/components.js" defer></script>
    <script type="module" src="js/weather_details.js" defer></script>
</head>

<body class="weather-body">

    <!-- Header -->
    <header class="weather-header">
        <button class="back-btn" onclick="history.back()" aria-label="Go Back">
            <span class="material-icons-round">arrow_back</span>
        </button>
        <div class="header-titles">
            <h1 class="header-main-title">আবহাওয়া ও পূর্বাভাস</h1>
            <div class="header-location">
                <span class="material-icons-round location-icon">location_on</span>
                <span id="loc-name" class="skeleton" style="width: 100px; height: 14px; border-radius: 4px;"></span>
            </div>
        </div>
        <div class="header-right"></div>
    </header>

    <main class="weather-main" id="weather-main">

        <!-- Pull to Refresh Indicator (Hidden initially) -->
        <div class="ptr-indicator" id="ptr-indicator">
            <div class="spinner"></div>
            <span>রিফ্রেশ করা হচ্ছে...</span>
        </div>

        <!-- Section 1: Today's Weather Banner -->
        <section class="today-weather-card glass-card">
            <div class="current-weather">
                <div class="weather-icon-large skeleton skeleton-circle" id="cw-icon" style="width: 80px; height: 80px; margin-bottom: 20px;"></div>
                <div class="temp-display">
                    <span class="current-temp" id="cw-temp">--°C</span>
                    <span class="condition-text skeleton" id="cw-cond" style="width: 80px; height: 16px; border-radius: 4px;"></span>
                </div>
            </div>

            <div class="temp-ranges">
                <div class="range-item">
                    <span class="material-icons-round text-muted">arrow_upward</span>
                    <span id="cw-max">--°</span>
                </div>
                <div class="range-item">
                    <span class="material-icons-round text-muted">arrow_downward</span>
                    <span id="cw-min">--°</span>
                </div>
                <div class="range-item">
                    <span id="cw-feels">অনুভূত হচ্ছে --°</span>
                </div>
            </div>

            <!-- Intelligent Weather Tip Container -->
            <div id="agri-tip-container" style="display: none; width: 100%;">
                <!-- JS will inject the tip box here -->
            </div>
        </section>

        <!-- Section 2: Current Details Grid -->
        <section class="current-details-grid">
            <div class="detail-card">
                <span class="material-icons-round">air</span>
                <div class="detail-info">
                    <span class="detail-label">বাতাস</span>
                    <span class="detail-value" id="cw-wind">-- কিমি/ঘ</span>
                </div>
            </div>
            <div class="detail-card">
                <span class="material-icons-round">water_drop</span>
                <div class="detail-info">
                    <span class="detail-label">আর্দ্রতা</span>
                    <span class="detail-value" id="cw-humidity">--%</span>
                </div>
            </div>
        </section>

        <!-- Section 3: Hourly Forecast -->
        <section class="forecast-section glass-card" style="margin-bottom: 20px;">
            <h3 class="section-title">আজকের প্রতি ঘণ্টার পূর্বাভাস</h3>
            <div id="hourly-forecast-list" style="display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none;">
                <div class="skeleton" style="width: 100%; height: 100px; border-radius: 16px;"></div>
            </div>
        </section>

        <!-- Section 4: 7-Day Forecast -->
        <section class="forecast-section glass-card">
            <h3 class="section-title">আগামী ৭ দিনের পূর্বাভাস</h3>
            <div class="forecast-list" id="forecast-list">
                <div class="skeleton" style="width: 100%; height: 300px; border-radius: 16px;"></div>
            </div>
        </section>

        <div style="height: 80px;"></div> <!-- Bottom Padding for Nav -->

    </main>

    <!-- Bottom Navigation -->
    <app-bottom-nav></app-bottom-nav>

</body>

</html>
