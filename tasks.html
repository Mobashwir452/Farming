<!DOCTYPE html>
<html lang="bn">

<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriTech - কাজের টাইমলাইন</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/tasks.css">

    <!-- JS Module -->
    <script type="module" src="js/components.js" defer></script>
    <script type="module" src="js/tasks.js" defer></script>
</head>

<body class="tasks-body">

    <!-- Inner Page Header -->
    <app-page-header page-title="কাজের টাইমলাইন" back-url="dashboard.html">
    </app-page-header>

    <!-- Tabs -->
    <div class="task-tabs">
        <button class="tab-btn active" data-target="tab-upcoming">আসন্ন</button>
        <button class="tab-btn" data-target="tab-missed">ওভারডিউ</button>
        <button class="tab-btn" data-target="tab-completed">সম্পন্ন</button>
        <button class="tab-btn" data-target="tab-canceled">বাতিল</button>
    </div>

    <main class="tasks-content">
        <!-- Upcoming Tab Content -->
        <div id="tab-upcoming" class="tab-content active">
            <div id="upcomingTasksList">
                <!-- JS will populate -->
            </div>
        </div>

        <!-- Missed/Overdue Tab Content -->
        <div id="tab-missed" class="tab-content" style="display: none;">
            <div id="missedTasksList">
                <!-- JS will populate -->
            </div>
        </div>

        <!-- Completed Tab Content -->
        <div id="tab-completed" class="tab-content" style="display: none;">
            <div id="completedTasksList">
                <!-- JS will populate -->
            </div>
        </div>

        <!-- Canceled Tab Content -->
        <div id="tab-canceled" class="tab-content" style="display: none;">
            <div id="cancelledTasksList">
                <!-- JS will populate -->
            </div>
        </div>
        
        <!-- Toast Notification -->
        <div id="toast" class="toast" style="display: none;"></div>
    </main>

    <!-- Calendar Bottom Sheet Modal -->
    <div class="calendar-modal" id="calendarModal">
        <div class="calendar-content">
            <div class="calendar-header">
                <h4>নতুন তারিখ নির্বাচন করুন</h4>
                <button class="close-modal" aria-label="Close modal">&times;</button>
            </div>
            <div class="calendar-body">
                <div class="calendar-month">মার্চ ২০২৬</div>
                <div class="calendar-weekdays">
                    <span>রবি</span><span>সোম</span><span>মঙ্গল</span><span>বুধ</span><span>বৃহ</span><span>শুক্র</span><span>শনি</span>
                </div>
                <div class="calendar-days" id="calendarDays">
                    <!-- JS will populate -->
                </div>
            </div>
            <div class="calendar-footer">
                <button class="btn-primary w-100" id="confirmReschedule">নির্ধারণ করুন</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <app-bottom-nav></app-bottom-nav>
</body>

</html>
