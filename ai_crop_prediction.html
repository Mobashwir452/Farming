<!DOCTYPE html>
<html lang="bn">

<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>এআই স্মার্ট প্রেডিকশন - AgriTech</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/ai_crop_prediction.css">

    <script type="module" src="js/components.js" defer></script>
    <script type="module" src="js/ai_crop_prediction.js" defer></script>
</head>

<body class="dashboard-body" style="background: #F8FAFC; padding-bottom: 100px;">
    <!-- Header -->
    <app-page-header page-title="এআই স্মার্ট এনালাইসিস">
        <div slot="action" style="background: #ECFDF5; color: #10B981; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
            </svg>
            স্মার্ট প্ল্যান
        </div>
    </app-page-header>

    <main class="prediction-content" style="padding-left: 16px; padding-right: 16px;">
        <!-- Top Info Context -->
        <div class="context-card">
            <div class="context-row">
                <span class="context-label">জমি:</span>
                <span class="context-val skeleton" id="farm-name-display" style="width: 100px; height: 14px; border-radius: 4px; display: inline-block;"></span>
            </div>
            <div class="context-row">
                <span class="context-label">ফসল:</span>
                <span class="context-val skeleton" id="crop-name-display" style="width: 80px; height: 14px; border-radius: 4px; display: inline-block;"></span>
            </div>
            <div class="context-row">
                <span class="context-label">জাত:</span>
                <span class="context-val skeleton" id="variety-name-display" style="width: 120px; height: 14px; border-radius: 4px; display: inline-block;"></span>
            </div>
        </div>

        <!-- Section Title -->
        <h2 class="section-title">সম্ভাব্য রূপরেখা</h2>

        <div id="ai-loading-state" style="padding: 10px 0;">
            <div class="pred-card skeleton" style="height: 140px; margin-bottom: 16px; border: none; box-shadow: none;"></div>
            <div class="pred-card skeleton" style="height: 180px; margin-bottom: 16px; border: none; box-shadow: none;"></div>
            <div class="skeleton" style="height: 200px; border-radius: 12px; margin-bottom: 16px;"></div>

            <div style="text-align: center; padding: 20px;">
                <h3 id="gemini-loading-msg" style="color: var(--text-main); font-size: 16px; transition: opacity 0.3s;">এআই ডাটা সিঙ্ক হচ্ছে...</h3>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">আপনার জমির জন্য সেরা পরিকল্পনা তৈরি হচ্ছে। দয়া করে অপেক্ষা করুন...</p>
            </div>
        </div>

        <div id="ai-result-content" style="display: none;">
            <!-- Yield Card -->
            <div class="pred-card yield-card">
                <div class="card-icon-header">
                    <div class="icon-box yield-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M16 12l-4-4-4 4"></path>
                            <path d="M12 16V8"></path>
                        </svg>
                    </div>
                    <h3>সম্ভাব্য ফলন</h3>
                </div>
                <div class="yield-amount" id="render-yield-range">-- <span>মণ</span></div>
                <div class="yield-condition">
                    <div class="condition-bar">
                        <div class="condition-fill excellent"></div>
                    </div>
                    <span id="render-yield-condition">--</span>
                </div>
            </div>

            <!-- Financial Card -->
            <div class="pred-card finance-card">
                <div class="card-icon-header">
                    <div class="icon-box finance-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                            <circle cx="12" cy="12" r="2"></circle>
                            <path d="M6 12h.01M18 12h.01"></path>
                        </svg>
                    </div>
                    <h3>সম্ভাব্য আর্থিক হিসাব</h3>
                </div>
                <div class="finance-grid">
                    <div class="fin-item">
                        <span class="fin-label">খরচ</span>
                        <span class="fin-val text-muted" id="render-fin-cost">--</span>
                    </div>
                    <div class="fin-item">
                        <span class="fin-label">আয়</span>
                        <span class="fin-val text-main" id="render-fin-revenue">--</span>
                    </div>
                </div>
                <div class="fin-profit">
                    <span>সম্ভাব্য নিট লাভ</span>
                    <span class="profit-val" id="render-fin-profit">--</span>
                </div>
            </div>

            <!-- Risks Card -->
            <div class="pred-card risk-card">
                <div class="card-icon-header">
                    <div class="icon-box risk-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                            </path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </div>
                    <h3>রিস্ক ও অ্যালার্ট</h3>
                </div>
                <ul class="risk-list" id="render-risks">
                    <!-- Risks injected here -->
                </ul>
            </div>

            <!-- Guideline Preview -->
            <h2 class="section-title">টাইমলাইন প্রিভিউ</h2>
            <div class="guideline-preview" id="render-timeline">
                <!-- Timeline injected here -->
            </div>
        </div>
    </main>

    <!-- Sticky Bottom Nav -->
    <div class="sticky-bottom-actions">
        <button class="btn-cancel" onclick="window.history.back()">বাতিল করুন</button>
        <button class="btn-accept" onclick="acceptAITimeline()">
            টাইমলাইন গ্রহণ করুন
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12l5 5L20 7"></path>
            </svg>
        </button>
    </div>
</body>

</html>
